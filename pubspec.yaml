name: birthday_special
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  confetti: ^0.7.0
  lottie: ^2.3.0
  audioplayers: ^1.1.1
  shared_preferences: ^2.0.15
  url_launcher: ^6.1.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # NEW: launcher icon generator
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/lottie/locked_heart.json
    - assets/lottie/birthday_balloons.json
    - assets/lottie/gift_box.json
    - assets/audio/birthday_song.mp3
    - assets/audio/birthday_greetings.mp3

# NEW: launcher icon config
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/heart.jpg"
